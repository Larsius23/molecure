# Published reference values.
# Cramer, Patterson & Bunce, J. Am. Chem. Soc. 1988, 110, 5959-5967.
# "Standard" settings in the paper: 2 A lattice, sp3 carbon probe (radius 1.52 A), +1 charge,
# Gasteiger-Marsili charges, 1/r dielectric, 30 kcal/mol cutoff, no autoscaling,
# four cross-validation groups, components added while cross-validated r2 increases.

cbg:
  n_training: 21
  table_ii: {components: 2, q2: 0.662, press: 0.719, r2: 0.897, s: 0.397}   # p. 5961
  table_iii_optimum: {components: 4, q2: 0.677}                              # p. 5965
  external:                                                                  # p. 5963
    n: 10
    predictive_r2_all: 0.65
    predictive_r2_without_compounds_1_9_10: 0.81
    note: SD is taken about the mean of the 21 training compounds (the Q2F1 definition)
  q2_range_when_the_paper_changed_settings:     # 2 components
    probe_radius: [0.649, 0.728]                # Table III
    lattice_offset_up_to_1_A: [0.559, 0.779]    # Table IV

tbg:
  n_training: 21
  table_ii: {components: 2, q2: 0.555, press: 0.849, r2: 0.873, s: 0.453}
  table_iii_optimum: {components: 3, q2: 0.577}
  q2_range_when_the_paper_changed_settings:
    probe_radius: [0.520, 0.660]
    lattice_offset_up_to_1_A: [0.500, 0.707]